<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡片动效调参 · §9.18</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, currentColor 14%, transparent); }
  body { margin: 0; padding: 24px; font: 13px/1.6 system-ui, "Segoe UI", sans-serif; background: canvas; color: canvastext; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.lead { margin: 0 0 18px; opacity: .7; max-width: 62ch; }
  fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0 0 14px; }
  legend { padding: 0 6px; opacity: .7; }
  label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  input[type=range] { width: 150px; }
  code { font: 11.5px/1.5 ui-monospace, monospace; opacity: .75; }
  .card { width: 340px; padding: 10px 12px; border: .5px solid var(--line); border-radius: 18px;
          background: color-mix(in srgb, canvastext 3%, canvas); box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
  .head { display: flex; align-items: flex-start; gap: 11px; }
  .body { flex: 1; min-width: 0; }
  .titleRow { display: flex; align-items: baseline; gap: 10px; }
  .title { flex: 1; padding: 0 4px; font-size: 13px; font-weight: 550; line-height: 20px; letter-spacing: -.005em; }
  .desc { -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; display: -webkit-box; overflow: hidden;
          margin: 4px 0 0; padding: 0 4px; font-size: 11.5px; line-height: 18px; opacity: .62; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .tag { padding: 4px 10px; border-radius: 999px; border: .5px solid transparent; font-size: 10.5px; line-height: 15px;
         background: color-mix(in srgb, currentColor 12%, transparent); }
  .chevron { width: 24px; height: 24px; margin-left: auto; border: 0; border-radius: 8px; background: transparent;
             color: inherit; opacity: .55; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
             transition: background 130ms ease, color 130ms ease; }
  .chevron:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
  .chevron svg { transition: rotate var(--dur-open) var(--jelly), scale 120ms ease; }
  .chevron:active svg { scale: .82; }
  .chevron.open svg { rotate: 90deg; }
  .fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-close) var(--jelly); }
  .fold > .detail { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s linear var(--dur-close); }
  .fold.open { grid-template-rows: 1fr; transition: grid-template-rows var(--dur-open) var(--jelly); }
  .fold.open > .detail { visibility: visible; transition: visibility 0s; }
  .detail { padding: 2px 0 2px 28px; }
  .divider { font-size: 10px; letter-spacing: .04em; opacity: .5; margin-top: 13px; }
  .rows { display: flex; gap: 7px; margin-top: 8px; font-size: 11px; line-height: 17px; opacity: .8; }
  .rows b { font-weight: 500; }
  .bar { display: flex; justify-content: flex-end; margin-top: 12px; }
  .del { width: 24px; height: 24px; border: 0; border-radius: 8px; background: transparent; color: inherit; opacity: .5; cursor: pointer; }
</style>
</head>
<body>
<h1>卡片动效调参 · DESIGN §9.18</h1>
<p class="lead">这是<b>调参器</b>，不是实现：插件里真正的 CSS 在 <code>WorkbenchTab.module.css</code>，本轮已按 A 预设落地。
在这里换曲线/时长，把想要的组合告诉我，我改一行 <code>--wb-jelly</code> 即可。</p>

<fieldset>
  <legend>弹簧曲线</legend>
  <label><input type="radio" name="curve" value="0.34,1.56,0.64,1" checked> A 果冻（<span data-peak="0"></span>，插件默认）</label>
  <label><input type="radio" name="curve" value="0.34,1.8,0.64,1"> B 强果冻（<span data-peak="1"></span>）</label>
  <label><input type="radio" name="curve" value="0.34,1.3,0.64,1"> C 轻回弹（<span data-peak="2"></span>）</label>
  <label><input type="radio" name="curve" value="0.22,0.61,0.36,1"> D 无过冲 · 平滑收束（<span data-peak="3"></span>）</label>
</fieldset>

<fieldset>
  <legend>时长</legend>
  <label>打开 <input id="durOpen" type="range" min="120" max="700" step="10" value="380"> <code id="durOpenOut">380ms</code></label>
  <label>收起 <input id="durClose" type="range" min="120" max="700" step="10" value="240"> <code id="durCloseOut">240ms</code></label>
  <label>描述框高度 <input id="durDesc" type="range" min="0" max="600" step="10" value="240"> <code id="durDescOut">240ms</code></label>
</fieldset>

<div class="card">
  <div class="head">
    <div class="body">
      <div class="titleRow"><span class="title">把右侧工作台接进侧边栏</span>
        <button class="chevron" id="toggle" aria-expanded="false" aria-label="展开">
          <svg width="14" height="14" viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M384 224a48 48 0 0 1 68-4l288 272a48 48 0 0 1 0 72l-288 272a48 48 0 0 1-68-68l257-242-257-242a48 48 0 0 1 0-60z"/></svg>
        </button>
      </div>
      <p class="desc" id="desc" contenteditable="true">点这里改描述：长到第二行时，这一段会按同一曲线弹簧式长高（收起状态下也在动）。</p>
      <div class="meta"><span class="tag">插件</span></div>
    </div>
  </div>
  <div class="fold" id="fold"><div class="detail">
    <div class="divider">待办总结</div>
    <div class="rows"><span>·</span><b>独立安装：Host 半与 client 半各自打包，靠 dsh.bundle.patch 挂载</b></div>
    <div class="rows"><span>·</span><b>搜索在 Host 做，模糊匹配与 8 位短号解析留在一起</b></div>
    <div class="bar"><button class="del" aria-label="删除">×</button></div>
  </div></div>
</div>

<script>
  const curves = [...document.querySelectorAll('input[name=curve]')].map((el) => el.value.split(',').map(Number))
  const bez = (u, a, b) => 3 * (1 - u) ** 2 * u * a + 3 * (1 - u) * u ** 2 * b + u ** 3
  const peak = ([, y1, , y2]) => Math.max(...Array.from({ length: 2001 }, (_, i) => bez(i / 2000, y1, y2)))
  curves.forEach((c, i) => { document.querySelector(`[data-peak="${i}"]`).textContent = `峰值 ${(100 * (peak(c) - 1)).toFixed(1)}%` })
  const root = document.documentElement, fold = document.getElementById('fold'), toggle = document.getElementById('toggle')
  const apply = () => {
    const chosen = document.querySelector('input[name=curve]:checked').value
    root.style.setProperty('--jelly', `cubic-bezier(${chosen})`)
    const open = document.getElementById('durOpen'), close = document.getElementById('durClose'), desc = document.getElementById('durDesc')
    root.style.setProperty('--dur-open', open.value + 'ms')
    root.style.setProperty('--dur-close', close.value + 'ms')
    document.getElementById('desc').style.transition = `height ${desc.value}ms var(--jelly)`
    for (const [el, out] of [[open, 'durOpenOut'], [close, 'durCloseOut'], [desc, 'durDescOut']])
      document.getElementById(out).textContent = el.value + 'ms'
  }
  toggle.onclick = () => {
    const open = fold.classList.toggle('open')
    toggle.classList.toggle('open', open)
    toggle.setAttribute('aria-expanded', String(open))
  }
  const autosize = () => { const node = document.getElementById('desc'); node.style.height = 'auto'; node.style.height = Math.min(36, Math.max(18, node.scrollHeight)) + 'px' }
  for (const el of document.querySelectorAll('input')) el.addEventListener('input', () => { apply(); autosize() })
  apply(); autosize()
</script>
</body>
</html>
